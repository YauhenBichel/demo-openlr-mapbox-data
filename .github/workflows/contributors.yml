name: Contributors

# The wall itself lives in readme-contributors as a reusable workflow. This
# file used to be a copy of it, and carried a `git add` that named a file this
# repository does not have, so the step died at exit 128 before it could ever
# commit. Sixteen repositories held the same copy and the same bug.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@v1
    secrets: inherit
